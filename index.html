<title>Transit Cafe - Owner Momen Al-Attar</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--gold:#e8c27a;--bg:#080808;--card:#141414;--border:#222}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#f5f2eb;font-family:'Cairo',sans-serif}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;padding:50px 20px;max-width:1100px;margin:auto;align-items:center}
.hero h1{font-family:'Bodoni Moda',serif;font-size:62px;line-height:.9}
.hero h1 i{color:var(--gold);font-style:italic}
.owner-img{width:100%;height:520px;object-fit:cover;border-radius:18px;border:2px solid var(--gold);object-position:top center}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.price{color:var(--gold);font-weight:800}
.btn{padding:10px 16px;border-radius:20px;font-weight:700;text-decoration:none;display:inline-flex;gap:6px;cursor:pointer;border:none;font-size:13px}
.btn.gold{background:var(--gold);color:#000}
.btn.wa{background:#25D366;color:#fff}
.btn.white{background:#fff;color:#000}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;padding:16px;overflow:auto}
.box{max-width:460px;margin:20px auto;background:#fff;color:#111;border-radius:14px;padding:18px}
.box input,.box select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:8px;font-family:'Cairo'}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h1{font-size:42px}}
</style>
</head>
