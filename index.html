<title>Transit Cafe | ترانزيت</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0a0a0a;--card:#161616;--gold:#e8c27a;--text:#f5f2eb;--muted:#9a9a9a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif}
h1,h2{font-family:'Bodoni Moda',serif}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 30px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:rgba(10,10,10,.95);z-index:99}
.logo{font-size:22px}.logo span{color:var(--gold)}
.hero{padding:60px 30px;display:grid;grid-template-columns:1.2fr .8fr;gap:40px}
.hero h1{font-size:64px;line-height:.95}.hero h1 em{color:var(--gold);font-style:italic}
.shift-box{margin-top:24px;background:#161616;border:1px solid #222;border-radius:14px;padding:14px 18px}
.menu-sec{padding:70px 30px;background:#0f0f0f}.title{font-size:48px;text-align:center}.title em{color:var(--gold);font-style:italic}
.grid{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:#161616;border:1px solid #1e1e1e;border-radius:14px;padding:16px;display:flex;justify-content:space-between}
.card .price{color:var(--gold);font-weight:800}
.owner-sec{padding:70px 30px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.btn-big{padding:14px;border-radius:12px;border:none;font-weight:700;display:flex;gap:8px;justify-content:center;text-decoration:none}
.btn-whatsapp{background:#25D366;color:#fff}.btn-call{background:#f5f2eb;color:#000}.btn-cash{background:var(--gold);color:#000}.btn-insta{background:linear-gradient(45deg,#feda75,#d62976);color:#fff}
.cash-box{margin-top:16px;background:#000;border:1px dashed var(--gold);border-radius:12px;padding:14px;text-align:center}
.cash-box code{font-size:20px;color:var(--gold)}
@media(max-width:800px){.hero,.owner-sec{grid-template-columns:1fr}}
</style>
</head>
